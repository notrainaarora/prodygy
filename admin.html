<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prodygy Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='38' fill='%23fff'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0d0d0d;--ink:#f2f2f0;--soft:#bdbdba;--mute:#7c7c79;--line:#1f1f1f;--bad:#e0675e}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 max(20px,3vw)}
header{display:flex;justify-content:space-between;align-items:center;height:72px;border-bottom:1px solid var(--line)}
.mark{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:18px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.mark span{font-family:"Instrument Sans",sans-serif;font-weight:400;font-size:13px;letter-spacing:0;text-transform:none;color:var(--mute);margin-left:10px}
.who{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--mute)}
.link{background:none;border:0;padding:8px 0;color:var(--soft);border-bottom:1px solid #333}
.link:hover{color:var(--ink);border-color:var(--ink)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(32px,4vw,44px);line-height:1.1;margin:0}
.sub{color:var(--soft);margin-top:10px}
.card{max-width:420px;margin:14vh auto 0}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
input[type=text],input[type=email],input[type=url],textarea{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid #2c2c2c;border-radius:0;padding:9px 0;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
:focus-visible{outline:1px solid var(--soft);outline-offset:3px}
.btn{background:var(--ink);color:#000;border:0;border-radius:999px;min-height:42px;padding:0 20px;font-weight:500}
.btn:hover{background:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #333}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #4a2522}
.msg{margin-top:16px;color:var(--soft);min-height:1.5em}
.msg.err{color:var(--bad)}
.tabs{display:flex;gap:26px;margin:40px 0 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;padding:12px 0;color:var(--mute);border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.bar p{color:var(--mute);margin:0;font-size:14px;max-width:40em}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.rows .nm{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;line-height:1.2}
.rows .ds{color:var(--mute);font-size:14px;margin-top:2px}
.rows .tag{display:inline-block;font-size:12px;color:var(--soft);border:1px solid #333;border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:middle}
.rows .hid .nm,.rows .hid .ds{opacity:.45}
.move{display:grid;gap:2px}
.move button,.act button{background:none;border:1px solid #262626;color:var(--soft);border-radius:8px;min-width:36px;min-height:32px;padding:0 10px}
.move button:hover,.act button:hover{border-color:var(--soft);color:var(--ink)}
.move button:disabled{opacity:.25;cursor:default}
.act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:28px 0;color:var(--mute)}
dialog{background:var(--panel);color:var(--ink);border:1px solid #2a2a2a;border-radius:16px;padding:28px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:28px;margin:0 0 20px}
dialog form{display:grid;gap:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--soft)}
.check input{width:18px;height:18px;accent-color:#fff}
.hint{font-size:12px;color:var(--mute)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
.foot div{display:flex;gap:10px}
@media(max-width:600px){.two{grid-template-columns:minmax(0,1fr)}.rows li{grid-template-columns:minmax(0,1fr);gap:10px}.move{display:flex;order:3}.act{justify-content:flex-start;order:2}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="/">Prodygy<span>Admin</span></a>
    <div class="who" id="who" hidden><span id="whoEmail"></span><button class="link" id="out">Sign out</button></div>
  </header>

  <section id="login" class="card" hidden>
    <h1>Sign in</h1>
    <p class="sub">We'll email you a one-time sign-in link.</p>
    <form id="loginForm" style="display:grid;gap:22px;margin-top:28px" novalidate>
      <label>Email<input type="email" id="email" autocomplete="email" required></label>
      <div><button class="btn" type="submit" id="sendBtn">Email me a link</button></div>
    </form>
    <p class="msg" id="loginMsg" role="status"></p>
  </section>

  <section id="denied" class="card" hidden>
    <h1>No access</h1>
    <p class="sub">This account isn't an admin for Prodygy.</p>
    <p style="margin-top:24px"><button class="link" id="out2">Sign out</button></p>
  </section>

  <section id="app" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="companies" aria-selected="true">Companies</button>
      <button role="tab" data-tab="cohort" aria-selected="false">Founding cohort</button>
      <button role="tab" data-tab="board" aria-selected="false">Board of mentors</button>
    </div>
    <div class="bar"><p id="tabHelp"></p><button class="btn" id="addBtn">Add</button></div>
    <ul class="rows" id="rows"></ul>
    <p class="msg" id="appMsg" role="status"></p>
    <p class="hint" style="margin:40px 0 60px">Changes appear on <a href="/" target="_blank" rel="noopener">prodygy.vercel.app</a> as soon as you save. Hidden items stay here but don't show on the site.</p>
  </section>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle">Edit</h2>
  <form id="editForm" method="dialog" novalidate>
    <label>Name<input type="text" id="fName" required></label>
    <label>One-line description<textarea id="fDesc"></textarea></label>
    <div class="two" id="companyFields">
      <label>Category<input type="text" id="fCat" placeholder="AI, Consumer, Fintech…"></label>
      <label>Status<input type="text" id="fStatus" placeholder="Building, Launched…"></label>
    </div>
    <label id="labelField">Right-side label<input type="text" id="fLabel" placeholder="Founder, Seat open…"></label>
    <label>Link (optional)<input type="url" id="fUrl" placeholder="https://"></label>
    <label class="check" id="openField"><input type="checkbox" id="fOpen"> Open spot (label links to the Apply page)</label>
    <label class="check"><input type="checkbox" id="fVisible" checked> Show on the website</label>
    <div class="foot">
      <button type="button" class="btn danger" id="delBtn">Delete</button>
      <div><button type="button" class="btn ghost" id="cancelBtn">Cancel</button><button type="submit" class="btn" id="saveBtn">Save</button></div>
    </div>
    <p class="msg" id="dlgMsg" role="status"></p>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
{
const SB_URL='https://bipwnsjtbwbfvxtoltfx.supabase.co',SB_KEY='sb_publishable_pn1Pt6vlZoR2ogsQyZ72gQ_EObjaY2u';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=id=>['login','denied','app'].forEach(s=>$(s).hidden=s!==id);
const HELP={companies:'Companies built by Prodygy founders. They appear on the Companies page in this order.',cohort:'Student founders in the founding cohort. Mark a row as an open spot to invite applications.',board:'Mentors on the board. Use open spots for seats you are still filling, then edit them when someone joins.'};
let tab='companies',items=[],editing=null;

/* sign in */
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();
  const email=$('email').value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email)){$('loginMsg').textContent='Enter a valid email.';$('loginMsg').className='msg err';return}
  $('sendBtn').disabled=true;$('loginMsg').className='msg';$('loginMsg').textContent='Sending…';
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/admin.html'}});
  $('sendBtn').disabled=false;
  if(error){$('loginMsg').className='msg err';$('loginMsg').textContent=error.message.includes('rate')?'Too many emails sent. Wait a few minutes and try again.':'Could not send the link. Try again.';return}
  $('loginMsg').textContent='Check your inbox for a sign-in link from Supabase. It opens this page signed in.'});
const signOut=async()=>{await sb.auth.signOut();location.replace('/admin.html')};
$('out').addEventListener('click',signOut);$('out2').addEventListener('click',signOut);

const start=async session=>{
  if(!session){$('who').hidden=true;show('login');return}
  $('who').hidden=false;$('whoEmail').textContent=session.user.email;
  const {data,error}=await sb.from('admins').select('email').limit(1);
  if(error||!data||!data.length){show('denied');return}
  show('app');load();
};
let current;
sb.auth.onAuthStateChange((_e,session)=>{const id=session?session.user.id:null;if(id===current&&id)return;current=id;setTimeout(()=>start(session),0)});

/* data */
const table=()=>tab==='companies'?'companies':'people';
const load=async()=>{
  $('tabHelp').textContent=HELP[tab];$('appMsg').textContent='';
  let q=sb.from(table()).select('*').order('sort',{ascending:true}).order('created_at',{ascending:true});
  if(tab!=='companies')q=q.eq('team',tab);
  const {data,error}=await q;
  if(error){$('appMsg').className='msg err';$('appMsg').textContent='Could not load. Refresh and try again.';return}
  items=data;draw();
};
const draw=()=>{
  if(!items.length){$('rows').innerHTML='<li class="empty" style="display:block">Nothing here yet. Use Add to create the first one.</li>';return}
  $('rows').innerHTML=items.map((x,i)=>{
    const tag=tab==='companies'?[x.category,x.status].filter(Boolean).join(' · '):(x.is_open?'Open spot':x.label);
    return `<li class="${x.visible?'':'hid'}" data-id="${esc(x.id)}">
      <div class="move"><button data-a="up" aria-label="Move up" ${i===0?'disabled':''}>↑</button><button data-a="down" aria-label="Move down" ${i===items.length-1?'disabled':''}>↓</button></div>
      <div><div class="nm">${esc(x.name)}${tag?`<span class="tag">${esc(tag)}</span>`:''}${x.visible?'':'<span class="tag">Hidden</span>'}</div><div class="ds">${esc(x.description)}</div></div>
      <div class="act"><button data-a="vis">${x.visible?'Hide':'Show'}</button><button data-a="edit">Edit</button></div>
    </li>`}).join('');
};
const flash=(t,err)=>{$('appMsg').className='msg'+(err?' err':'');$('appMsg').textContent=t;if(!err)setTimeout(()=>{if($('appMsg').textContent===t)$('appMsg').textContent=''},2500)};

$('rows').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.closest('li').dataset.id,i=items.findIndex(x=>x.id===id),x=items[i];
  if(b.dataset.a==='edit')return openEdit(x);
  if(b.dataset.a==='vis'){const {error}=await sb.from(table()).update({visible:!x.visible}).eq('id',id);if(error)return flash('Could not save.',1);x.visible=!x.visible;draw();return flash(x.visible?'Now showing on the site.':'Hidden from the site.')}
  const j=b.dataset.a==='up'?i-1:i+1;if(j<0||j>=items.length)return;
  [items[i],items[j]]=[items[j],items[i]];
  const updates=items.map((it,k)=>sb.from(table()).update({sort:k+1}).eq('id',it.id));
  draw();const res=await Promise.all(updates);
  if(res.some(r=>r.error)){flash('Could not save the new order.',1);load()}else flash('Order saved.');
});

/* edit dialog */
const dlg=$('dlg');
const openEdit=x=>{
  editing=x||null;const isCo=tab==='companies';
  $('dlgTitle').textContent=(x?'Edit ':'Add ')+(isCo?'company':tab==='cohort'?'founder':'mentor');
  $('companyFields').hidden=!isCo;$('labelField').hidden=isCo;$('openField').hidden=isCo;$('delBtn').hidden=!x;
  $('fName').value=x?.name||'';$('fDesc').value=x?.description||'';$('fUrl').value=x?.url||'';
  $('fCat').value=x?.category||'';$('fStatus').value=x?.status||'';
  $('fLabel').value=x?x.label:(tab==='cohort'?'Founder':'Mentor');$('fOpen').checked=!!x?.is_open;
  $('fVisible').checked=x?x.visible:true;$('dlgMsg').textContent='';$('fName').classList.remove('bad');
  dlg.showModal();$('fName').focus();
};
$('addBtn').addEventListener('click',()=>openEdit(null));
$('cancelBtn').addEventListener('click',()=>dlg.close());
$('editForm').addEventListener('submit',async e=>{e.preventDefault();
  const name=$('fName').value.trim();
  if(!name){$('dlgMsg').className='msg err';$('dlgMsg').textContent='Name is required.';$('fName').focus();return}
  let url=$('fUrl').value.trim();if(url&&!/^https?:\/\//i.test(url))url='https://'+url;
  const row={name,description:$('fDesc').value.trim(),url:url||null,visible:$('fVisible').checked};
  if(tab==='companies'){row.category=$('fCat').value.trim();row.status=$('fStatus').value.trim()}
  else{row.label=$('fLabel').value.trim();row.is_open=$('fOpen').checked;row.team=tab}
  $('saveBtn').disabled=true;
  const res=editing?await sb.from(table()).update(row).eq('id',editing.id):await sb.from(table()).insert({...row,sort:items.length+1});
  $('saveBtn').disabled=false;
  if(res.error){$('dlgMsg').className='msg err';$('dlgMsg').textContent='Could not save. Check your connection and try again.';return}
  dlg.close();await load();flash('Saved. It is live on the site.');
});
$('delBtn').addEventListener('click',async()=>{
  if(!editing||!confirm(`Delete "${editing.name}" for good? This can't be undone. (Use Hide to keep it but take it off the site.)`))return;
  const {error}=await sb.from(table()).delete().eq('id',editing.id);
  if(error){$('dlgMsg').className='msg err';$('dlgMsg').textContent='Could not delete.';return}
  dlg.close();await load();flash('Deleted.');
});

/* tabs */
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));load()});
}
</script>
</body>
</html>
